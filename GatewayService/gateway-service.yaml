apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-gateway
  namespace: test-runners   # <-- change this to your new namespace
  labels:
    app: ws-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ws-gateway
  template:
    metadata:
      labels:
        app: ws-gateway
    spec:
      serviceAccountName: ws-gateway
      # nodeSelector:              # <-- optional: pin the gateway to a specific node pool
      #   agentpool: <your-node-pool>
      containers:
      - name: gateway
        image: your-registry.example.com/gateway-image:latest   # <-- change to your container registry
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
